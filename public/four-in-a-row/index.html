        if (firstOpen(column) === -1) return;
        playClickedColumn(column, isMultiplayer() ? myChip() : 'blue');
      };
    }
    function buildBoardBody() {
      holes.replaceChildren(); bodyLayer.replaceChildren();
      const sheetRect = boardSheet.getBoundingClientRect();
      const rects = Array.from(boardEl.children, cell => cell.getBoundingClientRect());
      const add = (parent, className, rect) => { const element = document.createElement('div'); element.className = className; Object.assign(element.style, { left:`${rect.left - sheetRect.left}px`, top:`${rect.top - sheetRect.top}px`, width:`${rect.width}px`, height:`${rect.height}px` }); parent.append(element); };

      svg.append(path); bodyLayer.append(svg);
    }
    function firstOpen(c) { for (let r = rows - 1; r >= 0; r--) if (!board[r][c]) return r; return -1; }
    function availableColumns() { return Array.from({length:cols}, (_, c) => c).filter(c => firstOpen(c) !== -1); }
    function wouldWin(c, color) {
      const r = firstOpen(c); if (r < 0) return false;

      const openRow = firstOpen(selected);

        const r = Math.floor(index / cols), c = index % cols;
        const isHint = !locked && !board[r][c] && c === selected && r === openRow;

    async function playClickedColumn(column, color) {

    }
    function publishLivePreview() {
      if (!isMultiplayer() || locked || multiplayerRoom.status !== 'active' || multiplayerRoom.turn !== myChip() || lastPreviewSent === selected) return;
      lastPreviewSent = selected;
      supabaseClient.rpc('set_connect_four_preview', { room_id:multiplayerRoom.id, selected_column:selected }).catch(() => { lastPreviewSent = null; });
    }
    function setOpponent(name, avatar) {
      opponentName.textContent = name;
      opponent.classList.toggle('has-avatar', Boolean(avatar));
      if (avatar) opponentAvatar.src = avatar;
      else opponentAvatar.removeAttribute('src');
    }
    function setRoom(room) {
      multiplayerRoom = room;
      board = room.board;
      const chip = myChip();
      const isBlue = chip === 'blue';
      setOpponent(room.status === 'waiting' ? 'Ждём соперника' : isBlue ? (room.black_name || 'Соперник') : (room.blue_name || 'Соперник'), room.status === 'waiting' ? null : isBlue ? room.black_avatar : room.blue_avatar);
      if (room.status === 'waiting') { lastPreviewSent = null; locked = true; turn.textContent = 'Ждём соперника'; turn.classList.add('dark'); controls.classList.remove('hidden'); controls.classList.add('disabled'); }
      else if (room.status === 'finished') { finish(room.winner === chip ? 'blue' : room.winner === 'draw' ? null : 'black'); }
      else {
        locked = room.turn !== chip;
        if (!locked && firstOpen(selected) < 0) selected = availableColumns()[0] ?? selected;
        if (locked) lastPreviewSent = null;
        restart.classList.remove('show');
        turn.textContent = locked ? 'Ход соперника' : 'Твой ход'; turn.classList.toggle('dark', locked); controls.classList.remove('hidden'); controls.classList.toggle('disabled', locked);
      }
      render();
      showLiveOpponentPreview(room);
    }
    function boardChange(previous, next) {
      if (!previous || !next) return null;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (previous[r]?.[c] !== next[r]?.[c] && next[r]?.[c]) return { r, c, color:next[r][c] };
      return null;
    }
    function positionDropHint(column, color) {
      Array.from(boardEl.children).forEach(cell => cell.classList.remove('hint', 'hint-black'));
      const row = firstOpen(column);
      if (row >= 0) boardEl.children[row * cols + column].classList.add(color === 'black' ? 'hint-black' : 'hint');
    }
    function showLiveOpponentPreview(room) {
      const isOpponentTurn = room.status === 'active' && room.turn !== myChip();
      if (!isOpponentTurn) return;
      const isRemotePreview = room.preview_player && room.preview_player !== multiplayerUser?.id && room.preview_player === (room.turn === 'blue' ? room.blue_player : room.black_player) && Number.isInteger(room.preview_column);
      const color = room.turn;
      const chip = color === 'blue' ? preview : robotPreview;
      const otherChip = chip === preview ? robotPreview : preview;
      chip.style.setProperty('--chip', color === 'blue' ? '#004cff' : '#111');
      chip.style.setProperty('--trail', color === 'blue' ? 'rgba(0,76,255,.3)' : 'rgba(17,17,17,.3)');
      const column = isRemotePreview ? room.preview_column : selected;
      positionDropHint(column, color);
      otherChip.classList.remove('show'); positionChipPreview(chip, column); chip.classList.add('show'); remotePreviewColumn = column;
    }
    async function showRemoteMove(room) {
      const change = boardChange(board, room.board);
      if (remoteMoveInProgress) return;
      if (!change) return setRoom(room);
      if (pendingLocalMove && pendingLocalMove.r === change.r && pendingLocalMove.c === change.c && pendingLocalMove.color === change.color) return;
      remoteMoveInProgress = true; locked = true; controls.classList.add('disabled');
      const chip = change.color === 'blue' ? preview : robotPreview;
      chip.style.setProperty('--chip', change.color === 'blue' ? '#004cff' : '#111');
      chip.style.setProperty('--trail', change.color === 'blue' ? 'rgba(0,76,255,.3)' : 'rgba(17,17,17,.3)');
      let column = Number.isInteger(remotePreviewColumn) ? remotePreviewColumn : selected;
      positionDropHint(column, change.color); positionChipPreview(chip, column); chip.classList.add('show');
      const direction = Math.sign(change.c - column);
      while (direction && column !== change.c) {
        column += direction;
        positionDropHint(column, change.color);
        positionChipPreview(chip, column);
        await new Promise(resolve => setTimeout(resolve, 55));
      }
      await new Promise(resolve => setTimeout(resolve, 200));
      const dropSource = chip.getBoundingClientRect(); chip.classList.remove('show'); remotePreviewColumn = null;
      await animateDrop(change.c, change.r, change.color, dropSource);
      remoteMoveInProgress = false; setRoom(room);
    }
    function subscribeToRoom(id) {
      roomChannel?.unsubscribe();
      clearInterval(roomSyncTimer);
      roomChannel = supabaseClient.channel(`connect-four-${id}`).on('postgres_changes', { event:'UPDATE', schema:'public', table:'connect_four_rooms', filter:`id=eq.${id}` }, payload => showRemoteMove(payload.new)).subscribe();
      roomSyncTimer = setInterval(async () => {
        const { data } = await supabaseClient.from('connect_four_rooms').select('*').eq('id', id).single();
        if (data && data.updated_at !== multiplayerRoom?.updated_at) showRemoteMove(data);
      }, 100);
    }
    async function openRoom(id) {
      await ensureMultiplayerUser();
      const { data: existing, error } = await supabaseClient.from('connect_four_rooms').select('*').eq('id', id).single();
      if (error) throw new Error('Приглашение больше не действует');
      let room = existing;
      if (room.blue_player !== multiplayerUser.id && room.black_player !== multiplayerUser.id) {
        const joined = await supabaseClient.rpc('join_connect_four_room', { room_id:id, player_name:localProfile.name, player_avatar:localProfile.avatar });
        if (joined.error) throw joined.error;
        room = joined.data;
      }
      subscribeToRoom(id); setRoom(room);
    }
    async function createInvite() {
      try {
        await ensureMultiplayerUser();
        if (!multiplayerRoom) {
          const { data, error } = await supabaseClient.rpc('create_connect_four_room', { player_name:localProfile.name, player_avatar:localProfile.avatar });
          if (error) throw error;
          const url = new URL(location.href); url.searchParams.set('room', data.id); history.replaceState(null, '', url);
          subscribeToRoom(data.id); setRoom(data);
        }
        const url = `https://t.me/${TELEGRAM_BOT_USERNAME}?startapp=game_${multiplayerRoom.id}`;
        if (navigator.share) await navigator.share({ title:'Четыре в ряд', text:'Сыграем в Четыре в ряд?', url });
        else { await navigator.clipboard?.writeText(url); show('Ссылка-приглашение скопирована'); }
      } catch (error) { show(error.message || 'Не удалось создать приглашение'); }
    }
    async function playMultiplayer(c, color) {
      if (locked || color !== myChip() || multiplayerRoom.turn !== color || firstOpen(c) < 0) return;
      const r = firstOpen(c); locked = true; clearSelectionVisuals();
      try {
        pendingLocalMove = { r, c, color };
        lastPreviewSent = null;
        const move = supabaseClient.rpc('make_connect_four_move', { room_id:multiplayerRoom.id, selected_column:c });
        await animateDrop(c, r, color, color === 'black' ? robotPreview.getBoundingClientRect() : preview.getBoundingClientRect());
        const { data, error } = await move;
        if (error) throw error;
        pendingLocalMove = null;
        setRoom(data);
      } catch (error) { pendingLocalMove = null; locked = false; show(error.message || 'Ход не прошёл'); render(); }
    }
    invite.onclick = createInvite;
    function applyTelegramSafeArea() {
      const tg = window.Telegram?.WebApp;
      if (!tg) return;
      const set = (name, inset) => ['top', 'right', 'bottom', 'left'].forEach(side => document.documentElement.style.setProperty(`--${name}-${side}`, `${Math.max(0, Math.floor(inset?.[side] || 0))}px`));
      const apply = () => {
        set('tg-content-safe', tg.contentSafeAreaInset);
        try {
          tg.expand();
          document.documentElement.classList.toggle('tg-desktop', !['ios', 'android'].includes(tg.platform));
          if (tg.platform === 'ios' || tg.platform === 'android') tg.requestFullscreen?.();
        } catch {}
      };
      try { tg.ready(); apply(); tg.onEvent?.('safeAreaChanged', apply); tg.onEvent?.('contentSafeAreaChanged', apply); tg.onEvent?.('viewportChanged', apply); [120, 300, 700].forEach(delay => setTimeout(apply, delay)); } catch {}
    }
    applyTelegramSafeArea();
    render();
    if (roomId) openRoom(roomId).catch(error => { show(error.message || 'Не удалось открыть игру'); setOpponent('Соперник Робот'); });
  </script>
</body>
</html>
