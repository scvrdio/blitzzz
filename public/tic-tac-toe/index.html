<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    try {
      const topInset = window.parent !== window ? window.parent.getComputedStyle(window.parent.document.documentElement).getPropertyValue('--tg-content-safe-top') : '';
      if (topInset) document.documentElement.style.setProperty('--tg-content-safe-top', topInset);
      if (window.parent !== window) {
        const send = (type, detail = {}) => window.parent.postMessage({ type, ...detail }, window.location.origin);
        window.Telegram = window.Telegram || {};
        const webApp = window.Telegram.WebApp || {};
        window.Telegram.WebApp = { ...webApp, HapticFeedback:{ ...webApp.HapticFeedback, impactOccurred:style => send('blitzzz-haptic', { method:'impactOccurred', style }) } };
      }
    } catch {}
  </script>
  <title>Крестики-нолики</title>
  <style>
    :root { --tg-content-safe-top:0px; --tg-content-safe-bottom:0px; --tg-content-safe-left:0px; --tg-content-safe-right:0px; color:#111; background:#fff; font-family:'Merriweather', Georgia, serif; }
    * { box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; }
    body { margin:0; height:100svh; padding:calc(40px + var(--tg-content-safe-top)) var(--tg-content-safe-right) var(--tg-content-safe-bottom) var(--tg-content-safe-left); display:grid; place-items:center; }
    html.tg-desktop body { padding:0; }
    html.tg-desktop .app { height:100%; min-height:min(760px,100svh); }
    button { appearance:none; -webkit-appearance:none; font:inherit; }
    .app { position:relative; width:min(100%,450px); height:min(100%,852px); min-height:670px; display:flex; flex-direction:column; overflow:hidden; background:#fff; border-radius:48px; }
    .header { height:76px; flex:none; position:relative; display:flex; justify-content:flex-end; align-items:flex-start; padding:16px; z-index:2; }
    .exit { position:relative; z-index:1; width:44px; height:44px; padding:0; border:0; border-radius:50%; background:rgba(255,255,255,.56); cursor:pointer; transition:transform .12s ease; }
    .exit img { display:block; width:44px; height:44px; }
    .invite { position:absolute; top:16px; left:16px; z-index:1; display:grid; place-items:center; width:48px; height:48px; padding:16px; border:0; border-radius:40px; background:#ececec; cursor:pointer; transition:transform .12s ease; }
    .invite img { width:16px; height:16px; }
    .exit:active, .invite:active { transform:scale(.9); }
    h1 { position:absolute; inset:22px 0 auto; margin:0; text-align:center; font-size:20px; line-height:29px; font-weight:700; pointer-events:none; }
    .opponent { position:absolute; top:59px; left:50%; display:flex; gap:6px; align-items:center; padding:4px 12px; border-radius:99px; background:#ececec; color:rgba(0,0,0,.5); font:600 12px/16px 'Merriweather', Georgia, serif; transform:translateX(-50%); white-space:nowrap; }
    .opponent img { width:20px; height:20px; border-radius:50%; object-fit:cover; }
    .game { flex:1; min-height:0; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:32px; }
    .turn { flex:1; display:grid; place-items:center; width:100%; padding-top:18px; color:#004cff; font-size:32px; font-weight:900; line-height:1.2; text-align:center; }
    .turn.dark { color:#111; }
    .board { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; width:100%; overflow:hidden; border-radius:40px 40px 0 0; background:#f8f8f8; }
    .cell { position:relative; aspect-ratio:1; border:0; padding:0; background:#ececec; cursor:pointer; -webkit-tap-highlight-color:transparent; appearance:none; -webkit-appearance:none; }
    .cell:active { background:#ececec; }
    .cell:disabled { cursor:default; }
    .cell img { position:absolute; left:50%; top:50%; width:38%; height:38%; transform:translate(-50%,-50%); }
    .cell.o img { width:40%; height:40%; }
    .restart { position:absolute; z-index:2; left:50%; bottom:32px; width:auto; height:56px; margin:0; padding:0 16px; border:0; border-radius:40px; background:#111; color:#f8f8f8; font:700 16px/20px 'Merriweather', Georgia, serif; cursor:pointer; transform:translateX(-50%); transition:transform .18s cubic-bezier(.2,.8,.2,1); }
    .restart:active { transform:translateX(-50%) scale(.9); }
    .restart[hidden] { display:none; }
    @media (max-width:450px) { .app { border-radius:0; } }
    @media (max-height:730px) { .app { min-height:100%; } .game { gap:16px; } .restart { bottom:20px; } }
  </style>
</head>
<body>
  <main class="app" aria-label="Игра Крестики-нолики">
    <header class="header">
      <button class="invite" id="invite" type="button" aria-label="Пригласить друга"><img src="../four-in-a-row/assets/invite.svg" alt=""></button>
      <h1>Крестики-нолики</h1>
      <div class="opponent"><span>Соперник Робот</span></div>
      <a class="exit" href="/?leave=1" aria-label="Вернуться на главную"><img src="assets/figma-asset-1.svg" alt=""></a>
    </header>
    <section class="game">
      <div class="turn" id="turn" aria-live="polite">Твой ход</div>
      <div class="board" id="board" aria-label="Поле крестиков-ноликов"></div>
      <button class="restart" id="restart" type="button" hidden>Сыграть ещё</button>
    </section>
  </main>
  <script>
    const boardEl = document.querySelector('#board');
    const turn = document.querySelector('#turn');
    const restart = document.querySelector('#restart');
    const exitButton = document.querySelector('.exit');
    const invite = document.querySelector('#invite');
    const tg = window.Telegram?.WebApp;
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let cells = Array(9).fill(null), locked = false;
    if (window.location.protocol === 'file:') exitButton.href = '../index.html?leave=1';
    exitButton.addEventListener('click', event => {
      if (window.parent !== window) { event.preventDefault(); window.parent.postMessage({ type:'blitzzz-close-game' }, window.location.origin); }
      tg?.HapticFeedback?.impactOccurred?.('light');
    });
    invite.addEventListener('click', async () => {
      tg?.HapticFeedback?.impactOccurred?.('light');
      const url = 'https://t.me/blitzzzgames_bot?startapp=tic_tac_toe';
      try {
        if (navigator.share) await navigator.share({ title:'Крестики-нолики', text:'Сыграем в крестики-нолики?', url });
        else { await navigator.clipboard?.writeText(url); }
      } catch (error) { if (error?.name !== 'AbortError') console.warn(error); }
    });
    function winner(state) { return lines.find(line => state[line[0]] && state[line[0]] === state[line[1]] && state[line[1]] === state[line[2]]) || null; }
    function setTitle(text, dark = false) { turn.textContent = text; turn.classList.toggle('dark', dark); }
    function render() {
      boardEl.replaceChildren();
      cells.forEach((value, index) => {
        const cell = document.createElement('button');
        cell.className = `cell ${value || ''}`;
        cell.type = 'button'; cell.disabled = locked || Boolean(value); cell.setAttribute('aria-label', `Ячейка ${index + 1}`);
        if (value) { const icon = document.createElement('img'); icon.src = `assets/figma-asset-${value === 'x' ? '3' : '2'}.svg`; icon.alt = value === 'x' ? 'Крестик' : 'Нолик'; cell.append(icon); }
        cell.onclick = () => move(index); boardEl.append(cell);
      });
    }
    function finish(mark) {
      locked = true; restart.hidden = false;
      setTitle(mark === 'x' ? 'Победа' : mark === 'o' ? 'Поражение' : 'Ничья', mark === 'o');
      tg?.HapticFeedback?.notificationOccurred?.(mark === 'x' ? 'success' : mark === 'o' ? 'error' : 'warning'); render();
    }
    function robotMove() {
      const empties = cells.map((cell, index) => cell ? null : index).filter(index => index !== null);
      const winning = mark => empties.find(index => { const trial = cells.slice(); trial[index] = mark; return winner(trial); });
      const choice = winning('o') ?? winning('x') ?? (cells[4] ? undefined : 4) ?? empties[Math.floor(Math.random() * empties.length)];
      cells[choice ?? empties[0]] = 'o';
      const result = winner(cells); if (result) return finish('o'); if (!cells.includes(null)) return finish();
      locked = false; setTitle('Твой ход'); render();
    }
    function move(index) {
      if (locked || cells[index]) return;
      cells[index] = 'x'; tg?.HapticFeedback?.impactOccurred?.('light');
      const result = winner(cells); if (result) return finish('x'); if (!cells.includes(null)) return finish();
      locked = true; setTitle('Ход соперника', true); render();
      window.setTimeout(robotMove, 420);
    }
    restart.onclick = () => { cells = Array(9).fill(null); locked = false; restart.hidden = true; setTitle('Твой ход'); tg?.HapticFeedback?.impactOccurred?.('light'); render(); };
    function applyTelegramSafeArea() {
      if (window.parent !== window) return;
      const app = window.Telegram?.WebApp;
      if (!app) return;
      const set = (name, inset) => ['top', 'right', 'bottom', 'left'].forEach(side => document.documentElement.style.setProperty(`--${name}-${side}`, `${Math.max(0, Math.floor(inset?.[side] || 0))}px`));
      const apply = () => {
        set('tg-content-safe', app.contentSafeAreaInset);
        try { app.expand(); document.documentElement.classList.toggle('tg-desktop', !['ios', 'android'].includes(app.platform)); if (app.platform === 'ios' || app.platform === 'android') app.requestFullscreen?.(); } catch {}
      };
      try { app.ready(); apply(); app.onEvent?.('safeAreaChanged', apply); app.onEvent?.('contentSafeAreaChanged', apply); app.onEvent?.('viewportChanged', apply); [120,300,700].forEach(delay => setTimeout(apply, delay)); } catch {}
    }
    applyTelegramSafeArea(); render();
  </script>
</body>
</html>
