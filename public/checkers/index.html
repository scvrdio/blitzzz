<html lang="ru"><head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script><title>Шашки</title>
<script>try { const inset=window.parent!==window?window.parent.getComputedStyle(window.parent.document.documentElement).getPropertyValue('--tg-content-safe-top'):''; if(inset)document.documentElement.style.setProperty('--tg-content-safe-top',inset); } catch {}</script>
<style>
:root{--tg-content-safe-top:0px;--tg-content-safe-bottom:0px;--tg-content-safe-left:0px;--tg-content-safe-right:0px;color:#111;background:#fff;font-family:'Merriweather',Georgia,'Times New Roman',serif}*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{height:100%;overflow:hidden}body{margin:0;height:100svh;padding:calc(40px + var(--tg-content-safe-top)) var(--tg-content-safe-right) var(--tg-content-safe-bottom) var(--tg-content-safe-left);display:grid;place-items:center}html.tg-desktop body{padding:0}html.tg-desktop .app{height:100%;min-height:min(760px,100svh)}button{appearance:none;-webkit-appearance:none;font:inherit}button,a{-webkit-tap-highlight-color:transparent}.app{position:relative;width:min(100%,450px);height:min(100%,852px);min-height:670px;overflow:hidden;display:flex;flex-direction:column;background:#fff;border-radius:48px}.header{height:76px;flex:none;position:relative;padding:16px;display:flex;justify-content:flex-end;align-items:flex-start;z-index:2}.exit{position:relative;z-index:1;border:0;width:44px;height:44px;padding:0;border-radius:50%;background:rgba(255,255,255,.56);cursor:pointer;display:grid;place-items:center;transition:transform .12s ease}.exit img{width:44px;height:44px}h1{position:absolute;inset:22px 0 auto;margin:0;pointer-events:none;text-align:center;font-size:20px;line-height:29px;font-weight:700}.opponent{position:absolute;top:59px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:#ececec;color:rgba(0,0,0,.5);font:600 12px/16px 'Merriweather',Georgia,serif;white-space:nowrap}.invite{position:absolute;top:16px;left:16px;z-index:1;display:grid;place-items:center;width:48px;height:48px;padding:16px;border:0;border-radius:40px;background:#ececec;cursor:pointer;transition:transform .12s ease}.invite img{width:16px;height:16px}.exit:active,.invite:active{transform:scale(.9)}.game{display:flex;flex:1;min-height:0;flex-direction:column;align-items:center;justify-content:flex-end;gap:32px}.turn{flex:1;display:grid;place-items:center;width:100%;padding-top:18px;color:#004cff;font-size:32px;font-weight:900;line-height:1.2}.turn.opponent-turn,.turn.lost{color:#111}.checkers-sheet{flex:none;position:relative;width:100%;margin-bottom:128px;padding:16px 0;background:transparent}.checkers-layout{display:grid;grid-template-columns:32px 1fr 32px;grid-template-rows:32px 1fr 32px;gap:0}.col-labels{display:grid;grid-template-columns:repeat(8,1fr);color:#d6d6d6;font-size:12px;font-weight:900;text-align:center;line-height:32px}.col-top{grid-column:2;grid-row:1}.col-bottom{grid-column:2;grid-row:3}.row-labels{display:grid;grid-template-rows:repeat(8,1fr);color:#d6d6d6;font-size:12px;font-weight:900;text-align:center;line-height:1}.row-labels span{display:grid;place-items:center}.row-left{grid-column:1;grid-row:2}.row-right{grid-column:3;grid-row:2}.checkerboard{grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:1px;aspect-ratio:1;overflow:hidden;border-radius:16px;background:#fff}.square{position:relative;background:#ececec;cursor:pointer}.square.selected{outline:2px solid #004cff;outline-offset:-2px;z-index:1}.square.available::after{content:'';position:absolute;inset:38%;border-radius:50%;background:#004cff}.square img{position:absolute;z-index:1;inset:50% auto auto 50%;width:80%;height:80%;transform:translate(-50%,-50%)}.square.king img{width:86%;height:86%;filter:drop-shadow(0 0 0 #fff)}.square.king::before{content:'';position:absolute;z-index:2;inset:33%;border:2px solid #fff;border-radius:50%;pointer-events:none}.restart{position:absolute;z-index:2;left:50%;bottom:40px;width:auto;height:56px;margin:0;padding:0 16px;border:0;border-radius:40px;background:#111;color:#f8f8f8;font:700 16px/20px 'Merriweather',Georgia,serif;cursor:pointer;transform:translateX(-50%);transition:transform .12s ease}.restart:active{transform:translateX(-50%) scale(.92)}.restart[hidden]{display:none}@media(max-width:450px){.app{border-radius:0}}@media(max-height:730px){.app{min-height:100%}.game{gap:16px}.checkers-sheet{margin-bottom:100px}.restart{bottom:24px}}
</style><style>.square{border:0;padding:0}.square.selected{outline:0;background:rgba(0,76,255,.32)}</style></head><body><main class="app"><header class="header"><h1>Шашки</h1><button class="invite" id="invite" aria-label="Пригласить друга"><img src="../four-in-a-row/assets/invite.svg" alt=""></button><div class="opponent">Соперник Робот</div><a class="exit" href="/?leave=1" aria-label="Вернуться на главную"><img src="../four-in-a-row/assets/leave.svg" alt=""></a></header><section class="game"><div class="turn">Твой ход</div><section class="checkers-sheet" aria-label="Поле шашек"><div class="checkers-layout"><div class="col-labels col-top"></div><div class="row-labels row-left"></div><div class="checkerboard" id="board"></div><div class="row-labels row-right"></div><div class="col-labels col-bottom"></div></div></section><button class="restart" id="restart" type="button" hidden>Сыграть ещё</button></section></main><script>
const tg=window.Telegram?.WebApp;
for(const [selector,labels] of [['.col-labels','ABCDEFGH'],['.row-labels','12345678']])document.querySelectorAll(selector).forEach(group=>group.replaceChildren(...[...labels].map(label=>{const item=document.createElement('span');item.textContent=label;return item})));
const board=document.querySelector('#board'),turn=document.querySelector('.turn'),restart=document.querySelector('#restart');
const blackStart=[1,3,5,7,8,10,12,14,17,19,21,23],blueStart=[40,42,44,46,49,51,53,55,56,58,60,62];
let cells=[],selected=null,locked=false,chainPiece=null;
const row=i=>Math.floor(i/8),col=i=>i%8,inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const color=piece=>piece?.replace('-king',''),king=piece=>piece?.endsWith('-king');
const pieceMoves=(from,captureOnly=false,state=cells)=>{const piece=state[from];if(!piece)return[];const side=color(piece),r=row(from),c=col(from),moves=[],dirs=[[-1,-1],[-1,1],[1,-1],[1,1]];if(king(piece)){for(const[dr,dc]of dirs){let rr=r+dr,cc=c+dc,enemy=null;while(inside(rr,cc)){const at=rr*8+cc;if(!state[at]){if(enemy!==null)moves.push({from,to:at,capture:enemy});else if(!captureOnly)moves.push({from,to:at,capture:null});rr+=dr;cc+=dc;continue}if(enemy!==null||color(state[at])===side)break;enemy=at;rr+=dr;cc+=dc}}}else{const forward=side==='blue'?-1:1;if(!captureOnly)for(const dc of[-1,1]){const rr=r+forward,cc=c+dc;if(inside(rr,cc)&&!state[rr*8+cc])moves.push({from,to:rr*8+cc,capture:null})}for(const[dr,dc]of dirs){const over=inside(r+dr,c+dc)?(r+dr)*8+c+dc:null,land=inside(r+2*dr,c+2*dc)?(r+2*dr)*8+c+2*dc:null;if(over!==null&&land!==null&&state[over]&&color(state[over])!==side&&!state[land])moves.push({from,to:land,capture:over})}}return moves};
const legalMoves=(side,state=cells,only=null)=>{const pieces=only===null?state.map((p,i)=>p&&color(p)===side?i:null).filter(i=>i!==null):[only];const captures=pieces.flatMap(i=>pieceMoves(i,true,state).filter(m=>m.capture!==null));return captures.length?captures:pieces.flatMap(i=>pieceMoves(i,false,state).filter(m=>m.capture===null))};
const setTitle=(text,mode='')=>{turn.textContent=text;turn.className=`turn ${mode}`};
const draw=()=>{board.replaceChildren(...cells.map((piece,index)=>{const square=document.createElement('button');square.type='button';square.className=`square${selected===index?' selected':''}${king(piece)?' king':''}`;const moves=selected===null?[]:legalMoves('blue',cells,chainPiece??undefined).filter(m=>m.from===selected);if(moves.some(m=>m.to===index))square.classList.add('available');if(piece){const image=document.createElement('img');image.src=`assets/${color(piece)==='blue'?'black':'blue'}-checker.svg`;image.alt='';square.append(image)}square.onclick=()=>tap(index);return square}))};
const finish=(winner)=>{locked=true;selected=null;chainPiece=null;restart.hidden=false;setTitle(winner==='blue'?'Победа':'Поражение',winner==='blue'?'':'lost');draw()};
const promote=(at)=>{if(cells[at]==='blue'&&row(at)===0)cells[at]='blue-king';if(cells[at]==='black'&&row(at)===7)cells[at]='black-king'};
const commit=(move)=>{const piece=cells[move.from];cells[move.from]=null;cells[move.to]=piece;if(move.capture!==null)cells[move.capture]=null;promote(move.to)};
const yourTurn=()=>{if(!legalMoves('blue').length)return finish('black');locked=false;selected=null;chainPiece=null;setTitle('Твой ход');draw()};
const botTurn=()=>{if(!legalMoves('black').length)return finish('blue');locked=true;selected=null;chainPiece=null;setTitle('Ход соперника','opponent-turn');draw();setTimeout(botMove,450)};
const afterMove=(state,move)=>{const next=[...state],piece=next[move.from];next[move.from]=null;next[move.to]=piece;if(move.capture!==null)next[move.capture]=null;if(next[move.to]==='blue'&&row(move.to)===0)next[move.to]='blue-king';if(next[move.to]==='black'&&row(move.to)===7)next[move.to]='black-king';return next};
const positionScore=state=>state.reduce((total,piece,index)=>{if(!piece)return total;const value=(king(piece)?175:100)+(color(piece)==='black'?row(index):7-row(index))*5;return total+(color(piece)==='black'?value:-value)},0);
const chooseBotMove=moves=>{let best=moves[0],bestScore=-Infinity;for(const move of moves){const next=afterMove(cells,move),replies=legalMoves('blue',next),replyScores=replies.map(reply=>positionScore(afterMove(next,reply)));const replyRisk=replyScores.length?Math.min(...replyScores):positionScore(next);const score=positionScore(next)+(move.capture!==null?42:0)-Math.max(0,replyRisk-positionScore(next))*.8;if(score>bestScore){bestScore=score;best=move}}return best};
const botMove=()=>{const moves=legalMoves('black',cells,chainPiece??undefined);if(!moves.length){chainPiece=null;return yourTurn()}const move=chooseBotMove(moves);commit(move);draw();if(move.capture!==null&&pieceMoves(move.to,true).some(m=>m.capture!==null)){chainPiece=move.to;setTimeout(botMove,240);return}chainPiece=null;if(!legalMoves('blue').length)return finish('black');setTimeout(yourTurn,240)};
const tap=(index)=>{if(locked)return;const current=cells[index],moves=legalMoves('blue',cells,chainPiece??undefined);if(current&&color(current)==='blue'&&moves.some(m=>m.from===index)){selected=index;tg?.HapticFeedback?.selectionChanged?.();return draw()}if(selected===null)return;const move=moves.find(m=>m.from===selected&&m.to===index);if(!move)return;commit(move);tg?.HapticFeedback?.impactOccurred?.('light');if(move.capture!==null&&pieceMoves(move.to,true).some(m=>m.capture!==null)){selected=move.to;chainPiece=move.to;return draw()}selected=null;chainPiece=null;draw();setTimeout(botTurn,120)};
const reset=()=>{cells=Array(64).fill(null);blueStart.forEach(i=>cells[i]='blue');blackStart.forEach(i=>cells[i]='black');selected=null;chainPiece=null;locked=false;restart.hidden=true;yourTurn()};
restart.onclick=()=>{tg?.HapticFeedback?.impactOccurred?.('light');reset()};reset();
const exit=document.querySelector('.exit');if(location.protocol==='file:')exit.href='../index.html?leave=1';exit.onclick=e=>{if(parent!==window){e.preventDefault();parent.postMessage({type:'blitzzz-close-game'},location.origin)}};document.querySelector('#invite').onclick=async()=>{try{const url='https://t.me/blitzzzgames_bot?startapp=checkers';if(navigator.share)await navigator.share({title:'Шашки',text:'Сыграем в шашки?',url});else await navigator.clipboard?.writeText(url)}catch{}};try{tg?.ready();tg?.expand();document.documentElement.classList.toggle('tg-desktop',!['ios','android'].includes(tg?.platform));if(tg?.platform==='ios'||tg?.platform==='android')tg?.requestFullscreen?.()}catch{}
</script></body></html>
