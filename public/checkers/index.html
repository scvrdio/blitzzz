</style><style>.square{border:0;padding:0}.square.selected{outline:0;background:rgba(0,76,255,.32)}</style></head><body><main class="app"><header class="header"><h1>Шашки</h1><button class="invite" id="invite" aria-label="Пригласить друга"><img src="../four-in-a-row/assets/invite.svg" alt=""></button><div class="opponent">Соперник Робот</div><a class="exit" href="/?leave=1" aria-label="Вернуться на главную"><img src="../four-in-a-row/assets/leave.svg" alt=""></a></header><section class="game"><div class="turn">Твой ход</div><section class="checkers-sheet" aria-label="Поле шашек"><div class="checkers-layout"><div class="col-labels col-top"></div><div class="row-labels row-left"></div><div class="checkerboard" id="board"></div><div class="row-labels row-right"></div><div class="col-labels col-bottom"></div></div></section><button class="restart" id="restart" type="button" hidden>Сыграть ещё</button></section></main><script>

const row=i=>Math.floor(i/8),inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8,color=p=>p?.replace('-king',''),king=p=>p?.endsWith('-king'),multi=()=>Boolean(multiplayerRoom),myColor=()=>multiplayerRoom?.blue_player===multiplayerUser?.id?'blue':multiplayerRoom?.black_player===multiplayerUser?.id?'black':null,me=()=>multi()?myColor():'blue',isFlipped=()=>multi()&&me()==='black',viewIndex=index=>isFlipped()?63-index:index;

const pieceMoves=(from,captureOnly=false,state=cells)=>{const piece=state[from];if(!piece)return[];const side=color(piece),r=row(from),c=from%8,moves=[],dirs=[[-1,-1],[-1,1],[1,-1],[1,1]];if(king(piece)){for(const[dr,dc]of dirs){let rr=r+dr,cc=c+dc,enemy=null;while(inside(rr,cc)){const at=rr*8+cc;if(!state[at]){if(enemy!==null)moves.push({from,to:at,capture:enemy});else if(!captureOnly)moves.push({from,to:at,capture:null});rr+=dr;cc+=dc;continue}if(enemy!==null||color(state[at])===side)break;enemy=at;rr+=dr;cc+=dc}}}else{const forward=side==='blue'?-1:1;if(!captureOnly)for(const dc of[-1,1]){const rr=r+forward,cc=c+dc;if(inside(rr,cc)&&!state[rr*8+cc])moves.push({from,to:rr*8+cc,capture:null})}for(const[dr,dc]of dirs){const over=inside(r+dr,c+dc)?(r+dr)*8+c+dc:null,land=inside(r+2*dr,c+2*dc)?(r+2*dr)*8+c+2*dc:null;if(over!==null&&land!==null&&state[over]&&color(state[over])!==side&&!state[land])moves.push({from,to:land,capture:over})}}return moves};

const positionScore=state=>state.reduce((total,p,index)=>{if(!p)return total;const sign=color(p)==='black'?1:-1,advance=color(p)==='black'?row(index):7-row(index),column=index%8,center=column>=2&&column<=5?4:0,edge=column===0||column===7?-3:0;return total+sign*((king(p)?190:100)+advance*6+center+edge)},0);
const sequenceScore=sequence=>sequence.reduce((score,move,index)=>score+(move.capture===null?0:80)+(index?18:0),0)+((sequence.at(-1).to%8>=2&&sequence.at(-1).to%8<=5)?5:0);
const orderedSequences=(side,state,only=null)=>turnSequences(side,state,only).sort((a,b)=>sequenceScore(b)-sequenceScore(a));

const chooseBotMove=moves=>{const pieces=cells.filter(Boolean).length,depth=pieces>16?3:4,sequences=orderedSequences('black',cells,chainPiece).filter(sequence=>moves.some(move=>move.from===sequence[0].from&&move.to===sequence[0].to));let bestSequence=sequences[0],bestScore=-Infinity;for(const sequence of sequences){const next=sequence.reduce(afterMove,cells),score=minimax(next,'blue',depth-1,-Infinity,Infinity)+sequenceScore(sequence);if(score>bestScore){bestScore=score;bestSequence=sequence}}return bestSequence[0]};
const localTurn=()=>{const side=me();if(!legalMoves(side).length)return finish(side==='blue'?'black':'blue');locked=false;selected=null;chainPiece=null;setTitle('Твой ход');draw()};

async function saveMultiplayerMove(){const side=me(),next=side==='blue'?'black':'blue',winner=legalMoves(next).length?'':side;locked=true;const {data,error}=await supabaseClient.rpc('make_checkers_move',{room_id:multiplayerRoom.id,next_board:cells,next_turn:next,next_winner:winner||null});if(error){cells=[...multiplayerRoom.board];locked=false;draw();return}setRoom(data)}
